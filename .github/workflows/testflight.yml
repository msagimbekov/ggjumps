name: iOS TestFlight

# Signs with the Apple Distribution certificate kept in the repository secrets (the same one
# 99 cuts uses; files in ~/ggcuts-signing, never in the repo) and an App Store profile that
# tools/ci/app_store_profile.py finds or creates through the App Store Connect API. Automatic
# signing used to make a new Development certificate on every run until Apple's limit was hit.
#
# Secrets: IOS_DIST_KEY_BASE64, IOS_DIST_CERT_BASE64 (base64 of ggcuts_dist.key and
# distribution.pem), ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (App Store Connect API key, Admin).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  GODOT_VERSION: "4.5-stable"
  TEAM_ID: LKW8322T98
  BUNDLE_ID: com.ggjumps.app
  KEYCHAIN_NAME: build.keychain

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (App Store requires the iOS 26 SDK)
        run: |
          xc=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$xc/Contents/Developer"
          xcodebuild -version

      # Signing first so bad secrets fail fast, before the large Godot download.
      - name: Install the signing certificate
        env:
          DIST_KEY_BASE64: ${{ secrets.IOS_DIST_KEY_BASE64 }}
          DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
        run: |
          [ -n "$DIST_KEY_BASE64" ] && [ -n "$DIST_CERT_BASE64" ] || { echo "Missing IOS_DIST_* secrets"; exit 1; }
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          printf %s "$DIST_KEY_BASE64" | tr -d "[:space:]" | base64 --decode > "$RUNNER_TEMP/dist.key"
          printf %s "$DIST_CERT_BASE64" | tr -d "[:space:]" | base64 --decode > "$RUNNER_TEMP/dist.pem"
          # Build the p12 here with macOS's own LibreSSL: Apple's importer rejects p12 files
          # written by OpenSSL 3 even with legacy algorithms.
          P12_PASSWORD="$(uuidgen)"
          /usr/bin/openssl pkcs12 -export -inkey "$RUNNER_TEMP/dist.key" -in "$RUNNER_TEMP/dist.pem" -out "$RUNNER_TEMP/cert.p12" -passout "pass:$P12_PASSWORD"
          rm "$RUNNER_TEMP/dist.key"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_NAME" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" login.keychain
          security find-identity -v -p codesigning "$KEYCHAIN_NAME"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Get the App Store provisioning profile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 tools/ci/app_store_profile.py "$BUNDLE_ID" "$RUNNER_TEMP/dist.pem" \
            "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" "$ASC_KEY_ID" "$ASC_ISSUER_ID" | tee "$RUNNER_TEMP/profile.txt"
          PROFILE_UUID="$(tail -n 1 "$RUNNER_TEMP/profile.txt")"
          [ -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" ] || { echo "Profile not installed"; exit 1; }
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Install Godot and export templates
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}_macos.universal.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q godot.zip
          tdir="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$tdir"
          unzip -q templates.tpz -d templates
          mv templates/templates/* "$tdir/"
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      # The first run also downloads the AdMob plugin's native libraries (addons/admob).
      - name: Import project
        run: |
          "$GODOT" --headless --editor --quit || true
          "$GODOT" --headless --editor --quit || true

      - name: Export Xcode project
        run: |
          # The version players see comes from project.godot (application/config/version), as on
          # Android; TestFlight needs a unique build number per upload.
          APP_VERSION="$(tr -d '\r' < project.godot | sed -n 's/^config\/version="\(.*\)"$/\1/p')"
          [ -n "$APP_VERSION" ] || { echo "No application/config/version in project.godot"; exit 1; }
          sed -i '' "s/^application\/short_version=.*/application\/short_version=\"$APP_VERSION\"/" export_presets.cfg
          sed -i '' "s/^application\/version=.*/application\/version=\"${{ github.run_number }}\"/" export_presets.cfg
          echo "### iOS $APP_VERSION (${{ github.run_number }})" >> "$GITHUB_STEP_SUMMARY"
          sed -i '' 's/^application\/export_project_only=.*/application\/export_project_only=true/' export_presets.cfg
          sed -i '' "s/^application\/provisioning_profile_uuid_release=.*/application\/provisioning_profile_uuid_release=\"$PROFILE_UUID\"/" export_presets.cfg
          grep -n "provisioning_profile_uuid_release\|code_sign_identity_release" export_presets.cfg
          mkdir -p build/ios
          "$GODOT" --headless --export-release "iOS" build/ios/ggjumps.ipa
          ls build/ios

      # The AdMob plugin queues its Xcode patch (Google's SDK as a Swift package) for after the
      # export, which a one-shot headless run never reaches, so apply it here.
      - name: Add Google's SDK to the Xcode project
        run: |
          "$GODOT" --headless --script res://tools/ci/patch_xcodeproj.gd -- build/ios/ggjumps.xcodeproj/project.pbxproj
          grep -qE "admob_spm|XCLocalSwiftPackageReference" build/ios/ggjumps.xcodeproj/project.pbxproj || { echo "AdMob packages were not added to the Xcode project"; exit 1; }

      # Godot calls every iOS plugin's deinit hook (written into dummy.cpp; named
      # godot_apple_embedded_plugins_deinitialize since Godot 4.5, godot_ios_plugins_deinitialize
      # before) from Main::cleanup when the app quits, after the engine is torn down: the Share
      # plugin's share_plugin_deinit then deletes its object and crashes (seen in ggcuts at every
      # swipe-close). The process is ending anyway, so the hook is emptied.
      - name: Skip the iOS plugins' deinit hooks at quit
        run: |
          HOOK='void godot_(apple_embedded|ios)_plugins_deinitialize\(\) \{'
          FILES="$(grep -rlE "$HOOK" build/ios --include=*.cpp --include=*.mm || true)"
          [ -n "$FILES" ] || { echo "the plugins' deinit hook was not found in the exported project"; exit 1; }
          for F in $FILES; do
            perl -0pi -e 's/(void godot_(?:apple_embedded|ios)_plugins_deinitialize\(\) \{+)[^}]*/$1\n/g' "$F"
            echo "== $F"; grep -A2 -E "$HOOK" "$F"
          done
          ! grep -rq "^[[:space:]]*share_plugin_deinit();" build/ios || { echo "share_plugin_deinit is still called"; exit 1; }

      - name: Archive
        run: |
          cd build/ios
          xcodebuild archive \
            -project ggjumps.xcodeproj -scheme ggjumps \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ggjumps.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE="$PROFILE_UUID" PROVISIONING_PROFILE_SPECIFIER=""

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_UUID}</string></dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ggjumps.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Clean up the keys
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_NAME" || true
          rm -f "$RUNNER_TEMP/dist.pem" "$RUNNER_TEMP/dist.key" "$HOME/private_keys/"*.p8
